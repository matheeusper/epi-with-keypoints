# Receita de alta qualidade para uma RTX 3060 Ti com 8 GB de VRAM.
# Mantém batch efetivo 16, mas prioriza resolução maior para capacetes pequenos.

general:
  output_dir: "output_helmet_quality_576"
  dataset_dir: "construction-ppe"
  device: "cuda"
  seed: 42

# Estes parâmetros são enviados ao construtor de RFDETRSmall.
model:
  resolution: 576
  gradient_checkpointing: true

training:
  # O early stopping encerra antes se a validação não evoluir.
  epochs: 120

  # 1 × 16 = batch efetivo 16. A resolução 576 com checkpointing cabe em 8 GB.
  batch_size: 1
  grad_accum_steps: 16

  # Backbone mais conservador reduz o risco de destruir features pré-treinadas.
  lr: 1e-4
  lr_encoder: 5e-5

early_stopping:
  enabled: true
  patience: 20
  min_delta: 0.001
  use_ema: true

# Dataset com ~1.100 imagens: aumentos moderados, sem rotações agressivas.
# Eles exigem que o ambiente tenha os extras de augmentação do RF-DETR instalados.
augmentations:
  HorizontalFlip: {p: 0.5}
  RandomBrightnessContrast: {p: 0.35}
  ShiftScaleRotate:
    shift_limit: 0.03
    scale_limit: 0.10
    rotate_limit: 10
    p: 0.35
