# Configurações Gerais do Ambiente e Saída
general:
  output_dir: "output_base" # Alterado para diferenciar as saídas
  dataset_dir: "construction-ppe"
  device: "cuda"
  seed: 42

# Configurações que definem a arquitetura e o consumo de memória do modelo
model:
  resolution: 512
  gradient_checkpointing: true

# Hiperparâmetros de Treinamento
training:
  epochs: 100
  batch_size: 4
  grad_accum_steps: 4
  lr: 1e-4
  lr_encoder: 1.5e-4

# Configuração de Early Stopping
early_stopping:
  enabled: True
  patience: 15
  min_delta: 0.001
  use_ema: True

# Configuração de Augmentations (Aumentos de Dados)
augmentations:
  HorizontalFlip: {p: 0.5}
  RandomBrightnessContrast: {p: 0.4}
  ShiftScaleRotate: {shift_limit: 0.05, scale_limit: 0.15, rotate_limit: 15, p: 0.5}
